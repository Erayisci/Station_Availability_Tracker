server.port=8080

# H2 file-based embedded DB (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/zes-tracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# zes polling config
zes.poll.lat=39.96282958984371
zes.poll.lng=32.77142333984374
zes.poll.locationHash=b8dae592482b26a57c5368501cd70ef2
zes.poll.radius=12000
# Poll every 5 minutes (ms)
zes.poll.intervalMs=300000
# Daily index cron: every day at 23:59
zes.daily.cron=0 59 23 * * *
# Keep availability history for N days (older rows deleted on startup)
zes.history.keepDays=7

# -----------------------------------------------------------------------
# ASTOR polling config
# -----------------------------------------------------------------------
astor.api.userAgent=astor/79 CFNetwork/3860.400.51 Darwin/25.3.0
astor.api.tenantCode=beefull,astor
# Authorization token (Basic prefix eklenmeden sadece token)
astor.api.authorization=${ASTOR_API_AUTHORIZATION:}
# Poll every 5 minutes (ms)
astor.poll.intervalMs=300000
# Daily index cron: every day at 23:59
astor.daily.cron=0 59 23 * * *
# Keep availability history for N days
astor.history.keepDays=7
